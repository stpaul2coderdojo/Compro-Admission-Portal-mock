name: Build and Test Docker Container

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: compro-admissions-portal:latest

      - name: Run Docker Container & Health Check
        run: |
          docker run -d --name test-container -p 3000:3000 -e PORT=3000 compro-admissions-portal:latest
          sleep 5
          curl --fail http://localhost:3000/api/health || (docker logs test-container && exit 1)
          docker stop test-container
